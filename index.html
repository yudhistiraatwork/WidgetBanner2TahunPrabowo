<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Widget banner 2 Tahun Pemerintahan Prabowo Gibran"
    />
    <title>2 Tahun Prabowo Gibran</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css" />
    <link rel="stylesheet" href="./styles.css?v=20260918-progressive-right-margin" />
  </head>
  <body>
    <main class="widget-preview" aria-label="Pratinjau widget banner">
      <section class="anniversary-banner" aria-label="2 Tahun Pemerintahan Prabowo Gibran">
        <div class="banner-canvas">
          <img class="map" src="./Assets/Indonesia%20Maps.png" alt="" aria-hidden="true" />

          <div class="banner-content" id="banner-content">
            <section class="hero" aria-label="2 Tahun Pemerintahan Prabowo Gibran">
              <img class="hero-logo" src="./Assets/LogoKOMPAS.com.png" alt="Kompas.com" />

              <div class="hero-copy">
                <p class="eyebrow">2 Tahun Pemerintahan</p>
                <h1>Prabowo<br />Gibran</h1>
                <p class="hero-description">
                  Ikuti berita terupdate di Aplikasi KOMPAS.com,
                  <a href="#download-app">Download di sini</a>
                </p>
              </div>

              <img class="flag" src="./Assets/Bendera.png" alt="" aria-hidden="true" />
              <img class="leaders" src="./Assets/PrabowoGibran.png" alt="Ilustrasi Prabowo dan Gibran" />
            </section>

            <section class="article-carousel" aria-label="Artikel terkait Prabowo Gibran">
              <div class="article-viewport" tabindex="0">
                <div class="article-track" id="article-track"></div>
              </div>
              <button class="carousel-previous" type="button" aria-label="Tampilkan artikel sebelumnya">
                <i class="ph ph-caret-left" aria-hidden="true"></i>
              </button>
              <button class="carousel-next" type="button" aria-label="Tampilkan artikel berikutnya">
                <i class="ph ph-caret-right" aria-hidden="true"></i>
              </button>
            </section>

            <section class="mobile-article-pages" aria-label="Artikel terkait Prabowo Gibran">
              <div class="mobile-page-viewport" tabindex="0">
                <div class="mobile-page-track" id="mobile-page-track"></div>
              </div>
              <button class="mobile-page-previous" type="button" aria-label="Tampilkan artikel sebelumnya">
                <i class="ph ph-caret-left" aria-hidden="true"></i>
              </button>
              <button class="mobile-page-next" type="button" aria-label="Tampilkan dua artikel berikutnya">
                <i class="ph ph-caret-right" aria-hidden="true"></i>
              </button>
            </section>
          </div>

          <a class="app-download" id="download-app" href="#download-app" aria-label="Scan QR untuk mengunduh aplikasi Kompas.com">
            <img class="qr-code" src="./Assets/QRApps.png" alt="QR code unduhan aplikasi Kompas.com" />
            <span>Ikuti berita terupdate di<br />App KOMPAS.com.<br />Scan &amp; unduh sekarang</span>
          </a>
        </div>
      </section>
    </main>

    <script src="./app.js?v=20260918-two-card-hero-scroll"></script>
  </body>
</html>
