<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b96789" />
    <title>Kompas.com — iOS App Grid</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; color: #fff; background: #b96789; }
      * { box-sizing: border-box; }
      html, body { min-height: 100%; margin: 0; }
      body { display: grid; min-height: 100svh; place-items: center; background: linear-gradient(161deg, #ffd8c1 0%, #ec99b0 36%, #7551a0 100%); }
      body::before, body::after { position: fixed; z-index: 0; border-radius: 50%; content: ""; pointer-events: none; }
      body::before { width: 80vw; height: 80vw; top: 10vh; left: -38vw; background: rgb(255 249 221 / .25); filter: blur(18px); }
      body::after { width: 92vw; height: 92vw; right: -41vw; bottom: -30vh; background: rgb(107 45 150 / .46); filter: blur(25px); }
      main { position: relative; z-index: 1; display: grid; width: min(100%, 393px); height: min(100svh, 852px); place-items: center; padding: 22px clamp(20px, 7.38vw, 29px); }
      .grid { display: grid; grid-template-columns: repeat(4, 60px); width: 100%; justify-content: space-between; row-gap: 18px; }
      .app { min-width: 0; text-align: center; text-shadow: 0 1px 3px rgb(0 0 0 / .42); }
      .icon { display: grid; width: 60px; height: 60px; place-items: center; overflow: hidden; border-radius: 14px; background: #e5edf9; box-shadow: 0 2px 7px rgb(40 9 51 / .14); font-size: 25px; }
      .icon img { width: 100%; height: 100%; object-fit: cover; }
      .name { display: block; overflow: hidden; margin: 6px -7px 0; font-size: 12px; line-height: 1.1; text-overflow: ellipsis; white-space: nowrap; }
      .safari { background: linear-gradient(135deg, #e9f8ff, #258de7); }
      .camera { background: linear-gradient(135deg, #bd69dc, #fdbc68); }
      .photos { background: linear-gradient(135deg, #f6c54e, #f44d70); }
      .mail { background: linear-gradient(135deg, #3ab9f2, #2069cc); }
      .weather { background: linear-gradient(135deg, #63c5ff, #2a78df); }
      .notes { background: linear-gradient(180deg, #fff 0 20%, #fbd756 21%); color: #777; }
    </style>
  </head>
  <body>
    <main aria-label="Grid aplikasi iOS dengan thumbnail Kompas.com">
      <section class="grid" aria-label="Aplikasi">
        <div class="app"><div class="icon safari" aria-hidden="true">◉</div><span class="name">Safari</span></div>
        <div class="app"><div class="icon photos" aria-hidden="true">✿</div><span class="name">Photos</span></div>
        <div class="app"><div class="icon camera" aria-hidden="true">◉</div><span class="name">Camera</span></div>
        <div class="app"><div class="icon mail" aria-hidden="true">✉</div><span class="name">Mail</span></div>
        <div class="app"><div class="icon"><img src="./Assets/Thumbnail/IdulFitri.png" alt="Kompas.com — Idul Fitri" /></div><span class="name">Kompas.com</span></div>
        <div class="app"><div class="icon"><img src="./Assets/Thumbnail/HUTKemerdekaanRI.png" alt="Kompas.com — HUT Kemerdekaan RI" /></div><span class="name">Kompas.com</span></div>
        <div class="app"><div class="icon"><img src="./Assets/Thumbnail/Imlek.png" alt="Kompas.com — Imlek" /></div><span class="name">Kompas.com</span></div>
        <div class="app"><div class="icon"><img src="./Assets/Thumbnail/Natal.png" alt="Kompas.com — Natal" /></div><span class="name">Kompas.com</span></div>
        <div class="app"><div class="icon weather" aria-hidden="true">☀</div><span class="name">Weather</span></div>
        <div class="app"><div class="icon notes" aria-hidden="true">≡</div><span class="name">Notes</span></div>
      </section>
    </main>
  </body>
</html>
